version: '3.8'

# Standardized production log rotation anchor
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ----------------------------------------------------------------------------
  # 1. The Vulnerable Target (Honeypot)
  # Generates real-time Linux authentication telemetry
  # ----------------------------------------------------------------------------
  target-server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: vulnerable_target
    environment:
      - PUID=1000
      - PGID=1000
      - PASSWORD_ACCESS=true
      - USER_NAME=admin
      - USER_PASSWORD=password123
    ports:
      - "2222:2222"
    volumes:
      - shared-logs:/config/logs
    networks:
      - zero-trust-net
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 2. The Sensor (Telemetry Collector Daemon)
  # Tails logs with read-only least-privilege access and forwards to AI
  # ----------------------------------------------------------------------------
  telemetry-collector:
    build:
      context: ./collectors
      dockerfile: Dockerfile
    container_name: python_telemetry
    environment:
      - LOG_FILE_PATH=/var/log/target/auth.log
      - ORCHESTRATOR_URL=http://ai-orchestrator:8000/analyze
    volumes:
      - shared-logs:/var/log/target:ro
    networks:
      - zero-trust-net
    depends_on:
      - target-server
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 3. The Brain (Microsoft AutoGen AI Threat Orchestrator)
  # Non-root container running FastAPI, multi-agent swarm & Prometheus metrics
  # ----------------------------------------------------------------------------
  ai-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: threat_hunter_ai
    environment:
      - HUNTER_MODE=${HUNTER_MODE:-mock}
      - LLM_API_KEY=${LLM_API_KEY:-mock_key_for_testing}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - SENTINEL_WORKSPACE_ID=${SENTINEL_WORKSPACE_ID:-}
      - SENTINEL_SHARED_KEY=${SENTINEL_SHARED_KEY:-}
      - ACTION_LOG_PATH=/app/actions/pending_blocks.log
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    volumes:
      - ./agents:/app/agents
      - host-actions:/app/actions
    networks:
      - zero-trust-net
    depends_on:
      - telemetry-collector
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 4. Observability: Prometheus Metrics Collector
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: soc_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - zero-trust-net
    depends_on:
      - ai-orchestrator
    logging: *default-logging

  # ----------------------------------------------------------------------------
  # 5. Observability: Grafana SOC Dashboard
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: soc_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - zero-trust-net
    logging: *default-logging

volumes:
  shared-logs:
    name: threat_hunter_logs
  host-actions:
    name: threat_hunter_actions

networks:
  zero-trust-net:
    driver: bridge
    name: isolated_threat_net
