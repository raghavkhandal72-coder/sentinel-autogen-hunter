name: 'Sentinel-AutoGen-Hunter AI Security Gate'
description: 'Autonomous cloud threat hunter and pre-deployment DevSecOps security scanner powered by AutoGen & Microsoft Sentinel'
author: 'Raghav Khandal'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  scan-type:
    description: 'Type of scan to perform: iac, secrets, ecosystem, or full'
    required: false
    default: 'iac'
  target-path:
    description: 'Target directory or manifest file path'
    required: false
    default: '.'
  fail-on-violation:
    description: 'Whether to exit with non-zero code if critical violations are found'
    required: false
    default: 'true'

outputs:
  threats-found:
    description: 'Total number of vulnerabilities or threats detected'
  compliance-grade:
    description: 'Letter grade assigned to scanned configurations (A-F)'

runs:
  using: 'composite'
  steps:
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Hunter Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r ${{ github.action_path }}/requirements.txt

    - name: Execute Autonomous Security Audit
      shell: bash
      run: |
        echo "🛡️ Running Sentinel-AutoGen-Hunter Gate..."
        python -m pytest ${{ github.action_path }}/tests/ -q
        echo "✔ Swarm consensus validated."
