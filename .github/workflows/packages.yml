name: Publish to GitHub Packages (Containers, npm, NuGet, Maven, RubyGems)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-container:
    name: Containers (GHCR Docker Image)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-npm:
    name: npm Package (@raghavkhandal72-coder/sentinel-autogen-hunter)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@raghavkhandal72-coder'

      - name: Validate and test Node.js package
        run: npm test

      - name: Publish to GitHub Packages npm Registry
        run: npm publish --access public || echo "Package already published or up to date"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nuget:
    name: NuGet Package (Sentinel.AutoGen.Hunter)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Pack NuGet Package
        run: |
          dotnet pack clients/dotnet/Sentinel.AutoGen.Hunter.csproj -c Release -o clients/dotnet/nupkgs

      - name: Push to GitHub Packages NuGet Registry
        run: |
          dotnet nuget push clients/dotnet/nupkgs/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/raghavkhandal72-coder/index.json" --skip-duplicate || echo "NuGet package already published or up to date"

  publish-maven:
    name: Apache Maven Package (com.sentinel.hunter)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java & Maven
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Deploy to GitHub Packages Maven Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn --batch-mode deploy -f clients/java/pom.xml -DskipTests || echo "Maven package already published or up to date"

  publish-rubygems:
    name: RubyGem (sentinel-autogen-hunter)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Build and Push Gem to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd clients/ruby
          gem build sentinel-autogen-hunter.gemspec
          mkdir -p ~/.gem
          echo "---" > ~/.gem/credentials
          echo ":github: Bearer ${GITHUB_TOKEN}" >> ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push --key github --host https://rubygems.pkg.github.com/raghavkhandal72-coder sentinel-autogen-hunter-*.gem || echo "RubyGem already published or up to date"
