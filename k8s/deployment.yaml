apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-autogen-orchestrator
  namespace: secops
  labels:
    app: sentinel-autogen-hunter
    tier: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sentinel-autogen-hunter
  template:
    metadata:
      labels:
        app: sentinel-autogen-hunter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: orchestrator
          image: ghcr.io/yourusername/sentinel-autogen-hunter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: sentinel-hunter-config
          env:
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sentinel-hunter-secrets
                  key: llm-api-key
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-autogen-service
  namespace: secops
spec:
  type: ClusterIP
  selector:
    app: sentinel-autogen-hunter
  ports:
    - name: http
      port: 8000
      targetPort: 8000
